# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
# Settings live in deploy/.env (copy deploy/.env.example).
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ADDR: ":8080"
      DB_PATH: /data/game.db
      BACKUP_DIR: /backups
      TRUST_PROXY: "1"          # Caddy sets X-Forwarded-For / -Proto
    volumes:
      - data:/data
      - backups:/backups
    expose:
      - "8080"
    stop_grace_period: 20s      # lets the final backup finish

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional off-site copies: `docker compose -f deploy/docker-compose.yml --profile offsite up -d`
  # Needs deploy/rclone.conf (run `rclone config` anywhere, copy the file) and RCLONE_DEST in .env,
  # e.g. RCLONE_DEST=r2:fix-the-build-backups
  offsite:
    image: rclone/rclone:1.68
    profiles: ["offsite"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - backups:/backups:ro
      - ./rclone.conf:/config/rclone/rclone.conf:ro
    entrypoint: ["/bin/sh", "-c", "while true; do rclone copy /backups \"$$RCLONE_DEST\" --exclude game-latest.db --max-age 1h; sleep 300; done"]

volumes:
  data:
  backups:
  caddy_data:
  caddy_config:
